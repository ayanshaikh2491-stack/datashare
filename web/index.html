<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1a2e">
  <title>DataShare</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #6C63FF; --primary-dark: #5A52D5; --bg: #0f0f23; --card: #1a1a2e;
      --text: #e4e4e7; --text-secondary: #a1a1aa; --success: #22c55e; --warning: #f59e0b;
      --danger: #ef4444; --border: #27273a; --info: #3b82f6;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100dvh; overflow-x: hidden; }
    .screen { display: none; min-height: 100dvh; flex-direction: column; }
    .screen.active { display: flex; }
    .auth-container { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 2rem 1.5rem; }
    .logo { font-size: 3rem; margin-bottom: 0.5rem; }
    .auth-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.25rem; }
    .auth-subtitle { color: var(--text-secondary); margin-bottom: 2rem; font-size: 0.9rem; }
    .form-group { width: 100%; max-width: 320px; margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.4rem; }
    .form-group input { width: 100%; padding: 0.8rem 1rem; background: var(--card); border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-size: 1rem; outline: none; }
    .form-group input:focus { border-color: var(--primary); }
    .btn { width: 100%; max-width: 320px; padding: 0.9rem; background: var(--primary); color: white; border: none; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 0.5rem; transition: transform 0.1s; }
    .btn:active { transform: scale(0.97); }
    .btn-success { background: var(--success); color: #000; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-sm { padding: 0.5rem 1rem; font-size: 0.85rem; max-width: fit-content; }
    .link-btn { background: none; border: none; color: var(--primary); font-size: 0.9rem; cursor: pointer; margin-top: 1rem; padding: 0.5rem; }
    .role-selector { display: flex; gap: 0.5rem; width: 100%; max-width: 320px; margin-bottom: 1rem; }
    .role-btn { flex: 1; padding: 0.8rem; background: var(--card); border: 2px solid var(--border); border-radius: 12px; color: var(--text); font-size: 0.85rem; text-align: center; cursor: pointer; transition: all 0.2s; }
    .role-btn.active { border-color: var(--primary); background: rgba(108,99,255,0.15); color: var(--primary); }
    .header { padding: 1rem 1.2rem; background: var(--card); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 50; }
    .header h1 { font-size: 1.1rem; }
    .header-right { display: flex; gap: 0.4rem; align-items: center; }
    .badge { padding: 0.2rem 0.5rem; border-radius: 20px; font-size: 0.65rem; font-weight: 600; }
    .badge-donor { background: var(--primary); color: white; }
    .badge-receiver { background: var(--info); color: white; }
    .badge-both { background: var(--warning); color: #000; }
    .status-pill { display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.3rem 0.7rem; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
    .status-pill.online { background: rgba(34,197,94,0.15); color: var(--success); }
    .status-pill.offline { background: rgba(161,161,170,0.15); color: var(--text-secondary); }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; }
    .status-pill.online .status-dot { background: var(--success); }
    .status-pill.offline .status-dot { background: var(--text-secondary); }
    .content { flex: 1; padding: 1rem 1rem 5.5rem; overflow-y: auto; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1rem; margin-bottom: 0.7rem; }
    .card-title { font-weight: 600; font-size: 0.95rem; margin-bottom: 0.4rem; }
    .card-sub { font-size: 0.8rem; color: var(--text-secondary); }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; margin-bottom: 0.8rem; }
    .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 0.8rem; text-align: center; }
    .stat-val { font-size: 1.5rem; font-weight: 700; color: var(--primary); }
    .stat-val.green { color: var(--success); }
    .stat-val.orange { color: var(--warning); }
    .stat-lbl { font-size: 0.7rem; color: var(--text-secondary); margin-top: 0.15rem; }
    .section-title { font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin: 1rem 0 0.5rem; }
    .progress-bar { width: 100%; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin: 0.4rem 0; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--success)); border-radius: 3px; transition: width 0.5s; }
    .transfer-box { background: linear-gradient(135deg, var(--primary-dark), var(--primary)); border-radius: 14px; padding: 1rem; margin-bottom: 0.7rem; text-align: center; }
    .transfer-box .big { font-size: 2rem; font-weight: 700; }
    .transfer-box .sub { font-size: 0.85rem; opacity: 0.85; }
    .tab-bar { display: flex; background: var(--card); border-top: 1px solid var(--border); position: fixed; bottom: 0; left: 0; right: 0; z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
    .tab { flex: 1; padding: 0.5rem 0.2rem; text-align: center; font-size: 0.65rem; color: var(--text-secondary); cursor: pointer; transition: color 0.2s; }
    .tab.active { color: var(--primary); }
    .tab-icon { font-size: 1.3rem; display: block; margin-bottom: 0.1rem; }
    .donor-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 0.8rem 1rem; margin-bottom: 0.6rem; display: flex; align-items: center; justify-content: space-between; }
    .donor-info { flex: 1; }
    .donor-name { font-weight: 600; font-size: 0.95rem; }
    .donor-detail { font-size: 0.75rem; color: var(--text-secondary); }
    .review-item { display: flex; gap: 0.7rem; padding: 0.7rem 0; border-bottom: 1px solid var(--border); }
    .review-item:last-child { border-bottom: none; }
    .review-avatar { width: 34px; height: 34px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 0.85rem; flex-shrink: 0; }
    .review-stars { color: var(--warning); font-size: 0.85rem; }
    .review-comment { font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.2rem; }
    .star-input { display: flex; gap: 0.3rem; font-size: 1.5rem; }
    .star-input span { color: var(--border); cursor: pointer; transition: color 0.15s; }
    .star-input span.on { color: var(--warning); }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; align-items: flex-end; justify-content: center; }
    .modal-overlay.show { display: flex; }
    .modal { background: var(--card); border-radius: 20px 20px 0 0; padding: 1.5rem; width: 100%; max-width: 480px; }
    .modal-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .modal-title { font-size: 1.1rem; font-weight: 700; }
    .modal-x { background: none; border: none; color: var(--text-secondary); font-size: 1.4rem; cursor: pointer; padding: 0.3rem; }
    .empty { text-align: center; padding: 2.5rem 1rem; color: var(--text-secondary); }
    .empty-icon { font-size: 2.5rem; margin-bottom: 0.4rem; }
    .empty-text { font-size: 0.85rem; }
    .loading { text-align: center; padding: 3rem; color: var(--text-secondary); }
    .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 0.8rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toast { position: fixed; bottom: 5rem; left: 50%; transform: translateX(-50%); padding: 0.7rem 1.2rem; border-radius: 10px; font-size: 0.85rem; z-index: 1000; animation: toastIn 0.3s; white-space: nowrap; max-width: 90vw; text-align: center; }
    @keyframes toastIn { from { transform: translateX(-50%) translateY(15px); opacity: 0; } }
    .toast-ok { background: var(--success); color: #000; }
    .toast-err { background: var(--danger); color: white; }
    .toast-info { background: var(--info); color: white; }
    .refresh-btn { background: none; border: 1px solid var(--border); color: var(--text-secondary); border-radius: 8px; padding: 0.3rem 0.7rem; font-size: 0.75rem; cursor: pointer; }
    .refresh-btn:active { background: var(--border); }
    .conn-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 0.8rem 1rem; margin-bottom: 0.6rem; }
    .conn-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem; }
    .conn-name { font-weight: 600; font-size: 0.9rem; }
    .conn-status { font-size: 0.7rem; }
    .live-badge { background: var(--success); color: #000; padding: 0.15rem 0.5rem; border-radius: 10px; font-size: 0.65rem; font-weight: 700; }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen" class="screen active">
  <div class="auth-container">
    <div class="logo">📦</div>
    <h1 class="auth-title">DataShare</h1>
    <p class="auth-subtitle">Share data with your community</p>
    <div class="form-group"><label>Email</label><input type="email" id="loginEmail" placeholder="your@email.com" autocomplete="email"></div>
    <button class="btn" onclick="doLogin()">Login</button>
    <button class="link-btn" onclick="showScreen('registerScreen')">Create account →</button>
  </div>
</div>

<!-- REGISTER -->
<div id="registerScreen" class="screen">
  <div class="auth-container">
    <div class="logo">📦</div>
    <h1 class="auth-title">Create Account</h1>
    <p class="auth-subtitle">Join the community</p>
    <div class="form-group"><label>Name</label><input type="text" id="regName" placeholder="Your name" autocomplete="name"></div>
    <div class="form-group"><label>Email</label><input type="email" id="regEmail" placeholder="your@email.com" autocomplete="email"></div>
    <div class="form-group"><label>I want to:</label>
      <div class="role-selector">
        <div class="role-btn active" data-role="donor" onclick="pickRole('donor')">🎁 Donor</div>
        <div class="role-btn" data-role="receiver" onclick="pickRole('receiver')">📶 Receiver</div>
        <div class="role-btn" data-role="both" onclick="pickRole('both')">🔄 Both</div>
      </div>
    </div>
    <button class="btn" onclick="doRegister()">Create Account</button>
    <button class="link-btn" onclick="showScreen('loginScreen')">← Back to login</button>
  </div>
</div>

<!-- APP -->
<div id="appScreen" class="screen">
  <div class="header">
    <h1 id="hdrTitle">DataShare</h1>
    <div class="header-right">
      <span id="hdrBadge" class="badge badge-donor">Donor</span>
      <span id="hdrStatus" class="status-pill offline"><span class="status-dot"></span> Offline</span>
    </div>
  </div>
  <div id="content" class="content"></div>
  <div class="tab-bar">
    <div class="tab active" data-tab="home" onclick="goTab('home')"><span class="tab-icon">🏠</span>Home</div>
    <div class="tab" data-tab="donors" onclick="goTab('donors')"><span class="tab-icon">👥</span>Donors</div>
    <div class="tab" data-tab="share" onclick="goTab('share')"><span class="tab-icon">📁</span>Share</div>
    <div class="tab" data-tab="transfers" onclick="goTab('transfers')"><span class="tab-icon">📊</span>Transfers</div>
    <div class="tab" data-tab="reviews" onclick="goTab('reviews')"><span class="tab-icon">⭐</span>Reviews</div>
    <div class="tab" data-tab="settings" onclick="goTab('settings')"><span class="tab-icon">⚙️</span>Settings</div>
  </div>
</div>

<!-- REVIEW MODAL -->
<div id="reviewModal" class="modal-overlay" onclick="if(event.target===this)closeReview()">
  <div class="modal">
    <div class="modal-hdr"><h3 class="modal-title">⭐ Rate Donor</h3><button class="modal-x" onclick="closeReview()">✕</button></div>
    <div class="form-group"><label>Rating</label><div class="star-input" id="starInput"><span onclick="pickStar(1)">★</span><span onclick="pickStar(2)">★</span><span onclick="pickStar(3)">★</span><span onclick="pickStar(4)">★</span><span onclick="pickStar(5)">★</span></div></div>
    <div class="form-group"><label>Comment</label><input type="text" id="reviewComment" placeholder="Share your experience..."></div>
    <input type="hidden" id="reviewDonorId"><input type="hidden" id="reviewConnId">
    <button class="btn" onclick="submitReview()">Submit Review</button>
  </div>
</div>

<script>
const API = 'https://datashare-server.onrender.com/api';
var token = localStorage.getItem('token');
var user = JSON.parse(localStorage.getItem('user') || 'null');
var myRole = 'donor';
var isOnline = false;
var stars = 0;
var curTab = 'home';
var loading = false;

function showScreen(id) {
  var screens = document.querySelectorAll('.screen');
  for (var i = 0; i < screens.length; i++) screens[i].classList.remove('active');
  document.getElementById(id).classList.add('active');
}

function toast(msg, type) {
  type = type || 'info';
  var t = document.createElement('div');
  t.className = 'toast toast-' + type;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function() { if (t.parentNode) t.parentNode.removeChild(t); }, 2500);
}

async function api(ep, opts) {
  opts = opts || {};
  var h = { 'Content-Type': 'application/json' };
  if (token) h['Authorization'] = 'Bearer ' + token;
  if (opts.headers) { for (var k in opts.headers) h[k] = opts.headers[k]; }
  var r = await fetch(API + ep, { method: opts.method || 'GET', headers: h, body: opts.body ? JSON.stringify(opts.body) : undefined });
  var d = await r.json();
  if (!r.ok) throw new Error(d.error || d.details || 'Request failed');
  return d;
}

/* AUTH */
async function doLogin() {
  var email = document.getElementById('loginEmail').value.trim();
  if (!email) return toast('Enter email', 'err');
  try {
    var r = await api('/auth/login', { method: 'POST', body: { email: email } });
    token = r.token; user = r.user;
    localStorage.setItem('token', token);
    localStorage.setItem('user', JSON.stringify(user));
    toast('Welcome back!', 'ok');
    enterApp();
  } catch(e) { toast(e.message, 'err'); }
}

async function doRegister() {
  var name = document.getElementById('regName').value.trim();
  var email = document.getElementById('regEmail').value.trim();
  if (!name || !email) return toast('Fill all fields', 'err');
  try {
    var r = await api('/auth/register', { method: 'POST', body: { name: name, email: email, role: myRole } });
    token = r.token; user = r.user;
    localStorage.setItem('token', token);
    localStorage.setItem('user', JSON.stringify(user));
    toast('Account created!', 'ok');
    enterApp();
  } catch(e) { toast(e.message, 'err'); }
}

function pickRole(r) {
  myRole = r;
  var btns = document.querySelectorAll('.role-btn');
  for (var i = 0; i < btns.length; i++) {
    btns[i].classList.toggle('active', btns[i].getAttribute('data-role') === r);
  }
}

function logout() {
  token = null; user = null; isOnline = false;
  localStorage.removeItem('token'); localStorage.removeItem('user');
  showScreen('loginScreen');
}

/* APP ENTRY */
function enterApp() {
  showScreen('appScreen');
  var labels = { donor: '🎁 Donor', receiver: '📶 Receiver', both: '🔄 Both' };
  var bcls = { donor: 'badge-donor', receiver: 'badge-receiver', both: 'badge-both' };
  document.getElementById('hdrBadge').textContent = labels[user.role] || user.role;
  document.getElementById('hdrBadge').className = 'badge ' + (bcls[user.role] || 'badge-donor');
  myRole = user.role || 'donor';
  goTab('home');
}

/* TABS */
function goTab(tab) {
  curTab = tab;
  var tabs = document.querySelectorAll('.tab');
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].classList.toggle('active', tabs[i].getAttribute('data-tab') === tab);
  }
  var titles = { home: 'DataShare', donors: 'Available Donors', transfers: 'Transfers', reviews: 'Reviews', settings: 'Settings' };
  document.getElementById('hdrTitle').textContent = titles[tab] || 'DataShare';
  if (tab === 'home') loadHome();
  else if (tab === 'donors') loadDonors();
  else if (tab === 'share') loadShare();
  else if (tab === 'transfers') loadTransfers();
  else if (tab === 'reviews') loadReviews();
  else if (tab === 'settings') loadSettings();
}

/* HOME */
async function loadHome() {
  if (loading) return;
  loading = true;
  var c = document.getElementById('content');
  c.innerHTML = '<div class="loading"><div class="spinner"></div>Loading...</div>';
  try {
    var html = '';

    /* Donor controls */
    if (myRole === 'donor' || myRole === 'both') {
      var status = await api('/donor/status').catch(function() { return { donor: null }; });
      var d = status.donor || null;
      isOnline = d && d.status === 'online';

      var pill = document.getElementById('hdrStatus');
      pill.className = 'status-pill ' + (isOnline ? 'online' : 'offline');
      pill.innerHTML = '<span class="status-dot"></span> ' + (isOnline ? 'Online' : 'Offline');

      if (myRole === 'both') html += '<h3 style="margin-bottom:0.5rem;font-size:1rem;">🎁 Donor Mode</h3>';

      html += '<div class="card">';
      html += '<p style="margin-bottom:0.7rem;">Your status: <span class="status-pill ' + (isOnline ? 'online' : 'offline') + '"><span class="status-dot"></span>' + (isOnline ? 'Online' : 'Offline') + '</span></p>';
      if (isOnline) {
        html += '<button class="btn btn-danger" onclick="goOff()">⏹ Go Offline</button>';
      } else {
        html += '<button class="btn btn-success" onclick="goOn()">▶ Go Online & Share</button>';
      }
      html += '</div>';

      if (d) {
        html += '<div class="stats-grid">';
        html += '<div class="stat-card"><div class="stat-val">' + (d.current_receivers || 0) + '/' + (d.max_receivers || 3) + '</div><div class="stat-lbl">Active Receivers</div></div>';
        html += '<div class="stat-card"><div class="stat-val orange">' + (d.settings && d.settings.daily_total_gb ? d.settings.daily_total_gb : 5) + 'GB</div><div class="stat-lbl">Daily Limit</div></div>';
        html += '</div>';
      }

      /* Active connections for donor */
      var active = status.active_connections || [];
      if (active.length > 0) {
        html += '<div class="section-title">🔗 Active Connections</div>';
        for (var i = 0; i < active.length; i++) {
          var ac = active[i];
          var mb = ac.data_transferred_mb || ac.data_used_mb || 0;
          var lim = (d && d.settings && d.settings.data_limit_mb) ? d.settings.data_limit_mb : 500;
          var pct = Math.min(100, (mb / lim) * 100);
          html += '<div class="conn-card"><div class="conn-hdr"><div><div class="conn-name">📶 Receiver</div><div class="conn-status">' + mb.toFixed(1) + 'MB transferred</div></div><span class="live-badge">LIVE</span></div><div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div></div>';
        }
      }
    }

    /* Receiver info */
    if (myRole === 'receiver' || myRole === 'both') {
      if (myRole === 'both') html += '<h3 style="margin:1.2rem 0 0.5rem;font-size:1rem;">📶 Receiver Mode</h3>';
      var usage = await api('/usage/stats').catch(function() { return {}; });
      var st = usage.online || {};
      html += '<div class="stats-grid">';
      html += '<div class="stat-card"><div class="stat-val green">' + (st.donors || 0) + '</div><div class="stat-lbl">Donors Online</div></div>';
      html += '<div class="stat-card"><div class="stat-val">' + (st.receivers || 0) + '</div><div class="stat-lbl">Receivers Active</div></div>';
      html += '</div>';
    }

    c.innerHTML = html;
  } catch(e) {
    c.innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><p class="empty-text">' + e.message + '</p><button class="btn btn-sm" onclick="loadHome()" style="margin-top:1rem;">Retry</button></div>';
  }
  loading = false;
}

/* GO ONLINE / OFFLINE */
async function goOn() {
  try {
    toast('Going online...', 'info');
    await api('/donor/online', { method: 'POST', body: { lat: 25.2, lng: 55.2 } });
    isOnline = true;
    var pill = document.getElementById('hdrStatus');
    pill.className = 'status-pill online';
    pill.innerHTML = '<span class="status-dot"></span> Online';
    toast('Now sharing data! 🟢', 'ok');
    loadHome();
  } catch(e) { toast(e.message, 'err'); }
}

async function goOff() {
  try {
    await api('/donor/offline', { method: 'POST', body: {} });
    isOnline = false;
    var pill = document.getElementById('hdrStatus');
    pill.className = 'status-pill offline';
    pill.innerHTML = '<span class="status-dot"></span> Offline';
    toast('Now offline', 'info');
    loadHome();
  } catch(e) { toast(e.message, 'err'); }
}

/* DONORS */
async function loadDonors() {
  if (loading) return;
  loading = true;
  var c = document.getElementById('content');
  c.innerHTML = '<div class="loading"><div class="spinner"></div>Searching donors...</div>';
  try {
    var r = await api('/receiver/donors');
    var donors = r.donors || [];
    if (donors.length === 0) {
      c.innerHTML = '<div class="empty"><div class="empty-icon">👥</div><p class="empty-text">No donors online right now</p></div>';
    } else {
      var html = '<p style="color:var(--text-secondary);margin-bottom:0.7rem;font-size:0.8rem;">' + donors.length + ' donor' + (donors.length > 1 ? 's' : '') + ' available <button class="refresh-btn" onclick="loadDonors()">↻ Refresh</button></p>';
      for (var i = 0; i < donors.length; i++) {
        var d = donors[i];
        var busy = (d.current_receivers || 0) >= (d.max_receivers || 3);
        var slots = (d.max_receivers || 3) - (d.current_receivers || 0);
        html += '<div class="donor-card"><div class="donor-info"><div class="donor-name">' + (d.name || 'Donor') + '</div><div class="donor-detail">' + (busy ? '🔴 Full' : '🟢 Available — ' + slots + ' slot' + (slots !== 1 ? 's' : '') + ' left') + '</div></div>';
        if (!busy) html += '<button class="btn btn-sm btn-success" onclick="connect(\'' + d.id + '\')">Connect</button>';
        html += '</div>';
      }
      c.innerHTML = html;
    }
  } catch(e) {

        html += '<div class="transfer-box"><div class="big">' + mb.toFixed(1) + ' MB</div><div class="sub">' + (spd > 0 ? spd.toFixed(1) + ' MB/s' : 'Transfer complete') + '</div></div>';
        html += '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>';
        html += '<div style="display:flex;justify-content:space-between;font-size:0.75rem;color:var(--text-secondary);"><span>' + mb.toFixed(1) + 'MB / ' + lim + 'MB</span><span>' + pct.toFixed(0) + '%</span></div></div>';

    }
  } catch(e) {
    c.innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><p class="empty-text">' + e.message + '</p><button class="btn btn-sm" onclick="loadTransfers()" style="margin-top:1rem;">Retry</button></div>';

/* INIT */
window.onerror = function(msg, url, line, col, err) {
  var e = { error: msg, url: url, line: line, col: col, timestamp: Date.now(), userAgent: navigator.userAgent };
  try { fetch('https://datashare-server.onrender.com/api/report-error', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(e) }); } catch(x) {}
  console.error('Error:', msg, url, line);
  return false;
};

/* ===== WebRTC FILE TRANSFER ===== */
var pc = null; // PeerConnection
var dc = null; // DataChannel
var transferActive = false;
var transferBytes = 0;
var transferSpeed = 0;
var lastSpeedCheck = 0;
var lastSpeedBytes = 0;
var ws = null; // WebSocket for signaling

function formatBytes(b) {
  if (b < 1024) return b + ' B';
  if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
  return (b / (1024 * 1024)).toFixed(1) + ' MB';
}

// Connect WebSocket for signaling
function connectWS() {
  if (ws && ws.readyState === 1) return;
  ws = new WebSocket('wss://datashare-server.onrender.com');
  ws.onopen = function() { console.log('🔌 WebSocket connected'); };
  ws.onmessage = function(e) {
    try {
      var msg = JSON.parse(e.data);
      if (msg.type === 'webrtc_offer') handleOffer(msg);
      else if (msg.type === 'webrtc_answer') handleAnswer(msg);
      else if (msg.type === 'webrtc_ice') handleIce(msg);
      else if (msg.type === 'transfer_update') updateTransferUI(msg);
      else if (msg.type === 'transfer_complete') completeTransfer(msg);
    } catch(x) {}
  };
  ws.onclose = function() { console.log('🔌 WebSocket closed'); setTimeout(connectWS, 3000); };
  ws.onerror = function() { console.log('🔌 WebSocket error'); };
}

// Get WebRTC config from server
async function getWebRTCConfig() {
  try {
    var r = await api('/webrtc/config');
    return { iceServers: r.iceServers || [{ urls: 'stun:stun.l.google.com:19302' }] };
  } catch(e) {
    return { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
  }
}

// DONOR: Start sharing — create PeerConnection and DataChannel
async function startSharing(connectionId, donorId) {
  try {
    toast('Setting up connection...', 'info');
    var config = await getWebRTCConfig();
    pc = new RTCPeerConnection(config);

    // Create data channel for file transfer
    dc = pc.createDataChannel('datashare', { ordered: false });
    dc.binaryType = 'arraybuffer';
    dc.onopen = function() {
      transferActive = true;
      toast('🟢 Connection established! Ready to share files.', 'ok');
      // Create WebRTC session on server
      api('/webrtc/create-session', { method: 'POST', body: { connection_id: connectionId, receiver_id: donorId } }).catch(function(){});
    };
    dc.onmessage = function(e) {
      // Received file chunk
      if (e.data instanceof ArrayBuffer) {
        transferBytes += e.data.byteLength;
        var now = Date.now();
        if (now - lastSpeedCheck >= 1000) {
          transferSpeed = (transferBytes - lastSpeedBytes) / 1024; // KB/s
          lastSpeedBytes = transferBytes;
          lastSpeedCheck = now;
        }
        updateShareUI();
      }
    };
    dc.onclose = function() { transferActive = false; toast('Connection closed', 'info'); };
    dc.onerror = function(e) { console.error('DataChannel error:', e); };

    // ICE candidates
    pc.onicecandidate = function(e) {
      if (e.candidate) {
        api('/webrtc/ice', { method: 'POST', body: { connection_id: connectionId, candidate: e.candidate.toJSON() } }).catch(function(){});
      }
    };

    // Create offer
    var offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    // Send offer to server
    await api('/webrtc/offer', { method: 'POST', body: { connection_id: connectionId, offer: pc.localDescription } });
    toast('Offer sent, waiting for receiver...', 'info');
  } catch(e) {
    toast('WebRTC error: ' + e.message, 'err');
    console.error(e);
  }
}

// RECEIVER: Handle incoming offer
async function handleOffer(msg) {
  try {
    var config = await getWebRTCConfig();
    pc = new RTCPeerConnection(config);

    pc.ondatachannel = function(e) {
      dc = e.channel;
      dc.binaryType = 'arraybuffer';
      dc.onopen = function() {
        transferActive = true;
        toast('🟢 Connected to donor! Receiving data...', 'ok');
      };
      dc.onmessage = function(ev) {
        if (ev.data instanceof ArrayBuffer) {
          transferBytes += ev.data.byteLength;
          var now = Date.now();
          if (now - lastSpeedCheck >= 1000) {
            transferSpeed = (transferBytes - lastSpeedBytes) / 1024;
            lastSpeedBytes = transferBytes;
            lastSpeedCheck = now;
          }
          updateShareUI();
        }
      };
    };

    pc.onicecandidate = function(e) {
      if (e.candidate) {
        api('/webrtc/ice', { method: 'POST', body: { connection_id: msg.connection_id, candidate: e.candidate.toJSON() } }).catch(function(){});
      }
    };

    await pc.setRemoteDescription(new RTCSessionDescription(msg.offer));
    var answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);

    await api('/webrtc/answer', { method: 'POST', body: { connection_id: msg.connection_id, answer: pc.localDescription } });
    toast('Answer sent, connecting...', 'info');
  } catch(e) {
    console.error('Handle offer error:', e);
  }
}

// Handle incoming answer
function handleAnswer(msg) {
  if (pc && pc.signalingState !== 'closed') {
    pc.setRemoteDescription(new RTCSessionDescription(msg.answer)).catch(console.error);
    toast('🟢 Peer connected!', 'ok');
  }
}

// Handle ICE candidate
function handleIce(msg) {
  if (pc && pc.signalingState !== 'closed') {
    pc.addIceCandidate(new RTCIceCandidate(msg.candidate)).catch(console.error);
  }
}

// Update share tab UI
function updateShareUI() {
  var el = document.getElementById('shareProgress');
  if (!el) return;
  el.innerHTML = '<div class="transfer-box"><div class="big">' + formatBytes(transferBytes) + '</div><div class="sub">' + transferSpeed.toFixed(0) + ' KB/s</div></div>';
}

function updateTransferUI(msg) {
  var el = document.getElementById('transferLive');
  if (!el) return;
  var mb = msg.data_mb || 0;
  var spd = msg.speed_mbps || 0;
  var pct = Math.min(100, (mb / 500) * 100);
  el.innerHTML = '<div class="transfer-box"><div class="big">' + mb.toFixed(1) + ' MB</div><div class="sub">' + (spd > 0 ? spd.toFixed(1) + ' MB/s' : 'Transfer active') + '</div></div><div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div><div style="display:flex;justify-content:space-between;font-size:0.75rem;color:var(--text-secondary);"><span>' + mb.toFixed(1) + 'MB / 500MB</span><span>' + pct.toFixed(0) + '%</span></div>';
}

function completeTransfer(msg) {
  transferActive = false;
  toast('✅ Transfer complete! ' + formatBytes(transferBytes), 'ok');
  var el = document.getElementById('shareProgress');
  if (el) el.innerHTML = '<div class="transfer-box" style="background:linear-gradient(135deg,#16a34a,#22c55e)"><div class="big">✅ Complete!</div><div class="sub">' + formatBytes(transferBytes) + ' received</div></div>';
}

// Share a file (donor)
function shareFile(file) {
  if (!dc || dc.readyState !== 'open') return toast('No active connection', 'err');
  var reader = new FileReader();
  reader.onload = function() {
    var buffer = reader.result;
    var chunkSize = 16384; // 16KB chunks
    var offset = 0;
    function sendChunk() {
      if (offset >= buffer.byteLength) {
        toast('✅ File sent: ' + file.name, 'ok');
        return;
      }
      var chunk = buffer.slice(offset, offset + chunkSize);
      dc.send(chunk);
      offset += chunkSize;
      setTimeout(sendChunk, 5); // Small delay to prevent overwhelming
    }
    sendChunk();
  };
  reader.readAsArrayBuffer(file);
}

if (token && user) {
  enterApp();
  connectWS(); // Start WebSocket for signaling
} else {
  showScreen('loginScreen');
}
