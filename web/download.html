<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DataShare - Download APK</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a1a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .container {
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    .icon { font-size: 5rem; margin-bottom: 1rem; }
    h1 { font-size: 2rem; margin-bottom: 0.3rem; }
    .version { color: #888; font-size: 0.9rem; margin-bottom: 2rem; }
    .features {
      text-align: left;
      margin-bottom: 2rem;
    }
    .feature {
      display: flex;
      align-items: center;
      padding: 0.6rem 0;
      border-bottom: 1px solid #222;
    }
    .feature-icon { margin-right: 0.8rem; font-size: 1.2rem; }
    .feature-text { font-size: 0.9rem; color: #ccc; }
    .download-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: #22c55e;
      color: #000;
      padding: 1rem 2rem;
      border-radius: 50px;
      text-decoration: none;
      font-size: 1.2rem;
      font-weight: 700;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(34, 197, 94, 0.3);
    }
    .download-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 30px rgba(34, 197, 94, 0.5);
    }
    .download-btn:active { transform: scale(0.95); }
    .web-link {
      margin-top: 1.5rem;
      color: #6C63FF;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .web-link:hover { text-decoration: underline; }
    .note {
      margin-top: 1rem;
      font-size: 0.75rem;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📦</div>
    <h1>DataShare</h1>
    <p class="version">v1.0.0 • Android APK</p>

    <div class="features">
      <div class="feature">
        <span class="feature-icon">📶</span>
        <span class="feature-text">Share internet with community</span>
      </div>
      <div class="feature">
        <span class="feature-icon">🔒</span>
        <span class="feature-text">Secure & private connections</span>
      </div>
      <div class="feature">
        <span class="feature-icon">⚡</span>
        <span class="feature-text">Fast & lightweight app</span>
      </div>
      <div class="feature">
        <span class="feature-icon">🆓</span>
        <span class="feature-text">100% Free — No ads</span>
      </div>
    </div>

    <a href="app-release.apk" class="download-btn" id="downloadBtn">
      ⬇️ Download APK
    </a>

    <a href="/app" class="web-link">🌐 Or use Web Version (no install)</a>

    <p class="note">After download: Open file → Allow "Unknown Sources" → Install</p>
  </div>
</body>
</html>
