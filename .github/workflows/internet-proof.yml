name: OpenShare Build + Internet Proof

on:
  workflow_dispatch:
  push:
    paths:
      - 'server/**'
      - 'openshare/**'
      - '.github/workflows/**'

concurrency:
  group: openshare-proof
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.27.4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Real internet sharing test (donor tunnel)
        run: |
          set -euo pipefail
          cd server
          npm install --omit=dev >/dev/null 2>&1 || true
          node real_internet_share_test.js 2>&1 | tee /tmp/internet_proof.log

      - name: Build debug APK
        run: |
          cd openshare
          flutter pub get
          flutter build apk --debug

      - name: Upload proof log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internet-proof-log
          path: /tmp/internet_proof.log

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openshare-debug-apk
          path: openshare/build/app/outputs/flutter-apk/app-debug.apk
