name: Build Native Android APK

on:
  push:
    branches: [main]
    paths:
      - 'native-android/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name'
        required: false
        default: '5.0.0'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build APK
        uses: reactivecircus/android-build-action@v1
        with:
          api-level: 34
          target: default
          build-tools-version: 34.0.0
          working-directory: native-android
          script: |
            echo "sdk.dir=$ANDROID_HOME" > local.properties
            gradle wrapper --gradle-version=8.2
            chmod +x gradlew
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
            ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DataShare-VPN-APK
          path: native-android/app/build/outputs/apk/debug/app-debug.apk

      - name: APK Info
        run: |
          echo "=== APK ==="
          ls -lh native-android/app/build/outputs/apk/debug/app-debug.apk 2>/dev/null || echo "APK not found"
