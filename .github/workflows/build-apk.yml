name: Build Native Android APK

on:
  push:
    branches: [main]
    paths:
      - 'native-android/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name'
        required: false
        default: '5.0.0'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Install SDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: local.properties
        working-directory: native-android
        run: echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties

      - name: Generate wrapper
        working-directory: native-android
        run: |
          gradle wrapper --gradle-version=8.2
          chmod +x gradlew

      - name: Build APK
        working-directory: native-android
        run: ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tail -100

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DataShare-VPN-APK
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
