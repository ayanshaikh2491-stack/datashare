name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
  workflow_dispatch: # Manual trigger bhi

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.27.4'

      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: datashare-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: DataShare v1.0.${{ github.run_number }}
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
          body: |
            ## DataShare APK
            - Version: 1.0.${{ github.run_number }}
            - Built: ${{ github.event.head_commit.message }}
            - Download and install on your Android device
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
