name: Keep Server Alive

on:
  schedule:
    # Every 10 minutes - keeps Render free tier awake
    - cron: '*/10 * * * *'
  workflow_dispatch:  # Manual trigger bhi kar sakte ho

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping DataShare Server
        run: |
          curl -s --max-time 15 https://datashare-server.onrender.com/api/health
          echo ""
          echo "Server pinged successfully!"
