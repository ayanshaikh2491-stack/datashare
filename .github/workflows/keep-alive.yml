name: Keep Render Alive
on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes
  workflow_dispatch:       # Manual trigger bhi hai

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Server
        run: |
          URL="${{ secrets.RENDER_SERVICE_URL }}/api/health"
          echo "Pinging: $URL"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          echo "Status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✅ Server is awake!"
          else
            echo "⚠️ Server response: $STATUS"
          fi
