name: Relay keep-alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping relay health endpoint
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 https://ayanshaikh2-datashare-relay.hf.space/)
          echo "relay_health=$code"
          test "$code" = "200"
