name: Trigger Render Deploy

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'web/**'
      - '.github/workflows/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy
        run: |
          # Try Render deploy hook if available
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
            echo "Deploy hook triggered"
          else
            echo "No deploy hook secret configured"
          fi
