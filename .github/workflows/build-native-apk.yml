name: Build Native Android APK

on:
  push:
    branches: [main]
    paths:
      - 'native-android/**'
      - '.github/workflows/build-native-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle Wrapper
        working-directory: native-android
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: native-android
        run: ./gradlew assembleDebug --no-daemon

      - name: Copy APK to web folder
        run: |
          cp native-android/app/build/outputs/apk/debug/app-debug.apk web/app-release.apk
          echo "APK copied to web/app-release.apk"
          ls -lh web/app-release.apk

      - name: Update version.json
        run: |
          NEW_VERSION=$(date +%s)
          cat > web/version.json << 'EOF'
          {
            "versionCode": NEW_VERSION_PLACEHOLDER,
            "versionName": "5.3.0",
            "updateUrl": "/app-release.apk",
            "features": [
              "Fixed TCP seq tracking — apps connect properly",
              "Random per-connection seq numbers",
              "Better TCP handshake handling",
              "UDP packet relay support"
            ],
            "minVersion": 1,
            "forceUpdate": false,
            "releaseDate": "DATE_PLACEHOLDER"
          }
          EOF
          sed -i "s/NEW_VERSION_PLACEHOLDER/$(date +%s)/g" web/version.json
          sed -i "s/DATE_PLACEHOLDER/$(date +%Y-%m-%d)/g" web/version.json

      - name: Commit and Push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add web/app-release.apk web/version.json
          git diff --staged --quiet || git commit -m "Auto-build native APK [skip ci]"
          git push
