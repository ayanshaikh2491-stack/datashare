name: Build Native Android APK

on:
  push:
    branches: [main]
    paths:
      - 'native-android/**'
      - '.github/workflows/build-native-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle & Build
        working-directory: native-android
        run: |
          curl -s "https://get.sdkman.io" | bash
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk install gradle 8.5
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tail -50

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DataShare-Native-APK
          path: native-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.3.0-${{ github.run_number }}
          name: DataShare VPN v5.3.0 (Build ${{ github.run_number }})
          body: |
            ## DataShare VPN Native APK
            
            ### Fixes:
            - Fixed TCP sequence tracking — apps connect properly now
            - Random per-connection sequence numbers (was constant)
            - Better TCP handshake handling (pure ACK no longer ignored)
            - UDP packet relay support
            
            ### Install:
            Download the APK below and install on your Android device.
          files: native-android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update version.json in repo
        run: |
          NEW_VER=$(date +%s)
          TODAY=$(date +%Y-%m-%d)
          cat > web/version.json << EOF
          {
            "versionCode": $NEW_VER,
            "versionName": "5.3.0",
            "updateUrl": "https://github.com/ayanshaikh2491-stack/datashare/releases/latest/download/DataShare-Native-APK",
            "features": [
              "Fixed TCP seq tracking — apps connect properly",
              "Random per-connection seq numbers",
              "Better TCP handshake handling",
              "UDP packet relay support"
            ],
            "minVersion": 1,
            "forceUpdate": false,
            "releaseDate": "$TODAY"
          }
          EOF
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add web/version.json
          git diff --staged --quiet || (git commit -m "chore: update version to 5.3.0 [skip ci]" && git push)
