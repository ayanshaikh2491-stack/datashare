name: Build Native Android APK

on:
  push:
    branches: [main]
    paths:
      - 'native-android/**'
      - '.github/workflows/build-native-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle & Build
        working-directory: native-android
        run: |
          # Install sdkman to get gradle
          curl -s "https://get.sdkman.io" | bash
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk install gradle 8.5

          # Generate wrapper
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

          # Build
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tail -50

      - name: Copy APK
        run: |
          if [ -f native-android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp native-android/app/build/outputs/apk/debug/app-debug.apk web/app-release.apk
            echo "✅ APK: $(ls -lh web/app-release.apk | awk '{print $5}')"
          else
            echo "❌ APK not found!"
            find native-android -name "*.apk" 2>/dev/null
            exit 1
          fi

      - name: Update version
        run: |
          NEW_VER=$(date +%s)
          TODAY=$(date +%Y-%m-%d)
          cat > web/version.json << EOF
          {
            "versionCode": $NEW_VER,
            "versionName": "5.3.0",
            "updateUrl": "/app-release.apk",
            "features": [
              "Fixed TCP seq tracking — apps connect properly",
              "Random per-connection seq numbers",
              "Better TCP handshake handling",
              "UDP packet relay support"
            ],
            "minVersion": 1,
            "forceUpdate": false,
            "releaseDate": "$TODAY"
          }
          EOF

      - name: Commit APK
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add web/app-release.apk web/version.json
          git diff --staged --quiet || git commit -m "chore: auto-build APK [skip ci]"
          git push
